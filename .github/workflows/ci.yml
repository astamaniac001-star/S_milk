name: CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The default gate is OFFLINE-ONLY (2026-11-21 audit): lint, unit tests,
  # build, and enforced coverage thresholds. It never touches Supabase.
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Coverage (enforced thresholds)
        run: npm run test:coverage

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # CONTAINMENT (2026-11-21 audit): the live suites (test:db, e2e) MUTATE the
  # linked Supabase project, so they run ONLY in this explicit job AND only
  # when CI-specific secrets are configured. Point those secrets at a
  # DISPOSABLE project — never the production operator project.
  live-gate:
    runs-on: ubuntu-latest
    needs: offline-gate
    env:
      VITE_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
      E2E_OPERATOR_PIN: ${{ secrets.CI_E2E_OPERATOR_PIN }}
      E2E_OPERATOR_EMAIL: ${{ secrets.CI_E2E_OPERATOR_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Live DB / RLS / RPC suite
        if: ${{ env.VITE_SUPABASE_URL != '' && env.E2E_OPERATOR_PIN != '' }}
        run: npm run test:db

      - name: Install Edge for Playwright
        if: ${{ env.VITE_SUPABASE_URL != '' && env.E2E_OPERATOR_PIN != '' }}
        run: npx playwright install --with-deps msedge

      - name: Browser E2E
        if: ${{ env.VITE_SUPABASE_URL != '' && env.E2E_OPERATOR_PIN != '' }}
        run: npm run test:e2e
