name: CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Full Release Gate
        # Runs lint, vitest-integration (self-skips if env not set), unit tests, and build.
        # Coverage, prettier, circular deps, spellcheck, and depcheck are advisory only
        # and run separately via `npm run advisor-all` (not gated on CI).
        run: npm run check-all

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
